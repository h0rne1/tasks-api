services:
  db:
    image: postgres:16
    container_name: tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: tasks-api
    restart: unless-stopped
    environment:
      DB_HOST: db          # имя сервиса PostgreSQL в сети Compose
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: postgres
      DB_PASSWORD: "1234"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
